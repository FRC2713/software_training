services:
  hawk-learn:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      APP_URL: http://localhost:3000
      DATA_DIR: /data
      RUNNER_URL: http://hawk-learn-runner:4000
    volumes:
      - hawk_learn_data:/data
    networks:
      - default
      - learn_runner
    depends_on:
      - hawk-learn-runner

  hawk-learn-runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    networks:
      - learn_runner
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0

networks:
  learn_runner:
    internal: true

volumes:
  hawk_learn_data:
