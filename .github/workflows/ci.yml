name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Validate Hawk app contract
        run: node scripts/deploy-check.mjs --contract >/dev/null
      - name: Test server progress store
        run: node --test server/test_progress.mjs
      - name: Test Python runner
        run: python3 -m unittest discover -t . -s runner -p "test_*.py" -v
